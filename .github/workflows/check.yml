name: Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/main.js && node --check test/harness.js && jq . src/info.json appcast.json > /dev/null
      - name: Offline unit checks
        run: node test/unit.js
